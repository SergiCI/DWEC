<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Manual del Acordeón de FAQ</title>
  <style>
    .oculto {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Filtro de Ciudades por País</h2>

    <!-- Caja de búsqueda -->
    <div class="search-box">
      <input type="text" id="input-filtro" placeholder="Ej. España, Japón...">
      <button id="btn-filtrar">Filtrar</button>
    </div>

    <!-- Lista <ul> donde se mostrarán los elementos generados a partir del array -->
    <ul id="lista-ciudades"></ul>
  </div>
  <script src="imagenes.js"></script>

</body>

</html>
