<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Manual del Acordeón de FAQ</title>
</head>

<body>
    <div class="form-container">
    <h2>Formulario de Registro</h2>
    
    <form id="mi-formulario" onsubmit="event.preventDefault(); generarInformeDeValidacion();">
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Tu nombre">
      </div>

      <div class="campo">
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="ejemplo@correo.com">
      </div>

      <button type="submit">Validar y Enviar</button>
    </form>

    <!-- Div vacío requerido para mostrar el informe de errores -->
    <div id="informe-errores"></div>
  </div>

    <script src="imagenes.js"></script>

</body>

</html>
