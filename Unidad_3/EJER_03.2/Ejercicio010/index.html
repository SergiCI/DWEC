<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Manual del Acordeón de FAQ</title>
  <style>
    .oculto {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Generador de Texto de Relleno</h2>
    
    <!-- Controles: Input numérico y botón -->
    <div class="form-group">
      <label for="cantidad">Párrafos:</label>
      <input type="number" id="cantidad" min="1" max="20" value="3">
      <button id="btn-generar">Generar</button>
    </div>

    <!-- Div vacío requerido para mostrar los párrafos generados -->
    <div id="resultado"></div>
  </div>
  <script src="imagenes.js"></script>

</body>

</html>
