<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>La API de validación: validity</title>
  <style>
body { font-family: Arial, sans-serif; margin: 24px; max-width: 520px; }
label { display: block; margin-top: 10px; }
input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], textarea, select { padding: 6px; width: 100%; box-sizing: border-box; }
button { margin-top: 12px; padding: 6px 14px; }
.nota { color: #666; font-size: 14px; }
input { display: block; padding: 6px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
<h2>La API de validación: validity</h2>
<form id="registro" name="registro" method="post" action="registro.html">
  <label for="usuario">Usuario:</label>
  <input type="text" id="usuario" name="usuario" required minlength="3">

  <label for="correo">Correo electrónico:</label>
  <input type="email" id="correo" name="correo" required>

  <label for="web">Sitio web:</label>
  <input type="url" id="web" name="web">

  <label for="edad">Edad:</label>
  <input type="number" id="edad" name="edad" min="18" max="99" value="18">

  <button type="submit">Registrarse</button>
</form>
<p class="nota">Abre la consola del navegador (F12) para ver los resultados.</p>
<script type="module">
const campoCorreo = document.getElementById('correo');

campoCorreo.addEventListener('change', () => {
  console.log(campoCorreo.validity.valid);        // true El campo no tiene ningún error.
  console.log(campoCorreo.willValidate);          // true El campo puede ser validado (no tiene atributo disabled ni readonly).
  console.log(campoCorreo.validity);              // ValidityState { valueMissing: ..., ... }
  console.log(campoCorreo.validity.valueMissing); // ¿falta el valor?
  console.log(campoCorreo.validity.valid);        // ¿es válido?
  console.log(campoCorreo.validationMessage);     // mensaje del navegador ('' si es válido)
});
</script>
</body>
</html>
