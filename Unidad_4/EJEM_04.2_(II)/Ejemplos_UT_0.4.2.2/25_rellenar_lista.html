<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rellenar una lista con JavaScript</title>
  <style>
body { font-family: Arial, sans-serif; margin: 24px; max-width: 520px; }
label { display: block; margin-top: 10px; }
input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], textarea, select { padding: 6px; width: 100%; box-sizing: border-box; }
button { margin-top: 12px; padding: 6px 14px; }
.nota { color: #666; font-size: 14px; }
select { width: auto; }
  </style>
</head>
<body>
<h2>Rellenar una lista con JavaScript</h2>
<select id="pizza" name="pizza"></select>
<script type="module">
const lista = document.getElementById('pizza');
const pizzas = [
  { nombre: 'Pizza Salami', id: 'P001' },
  { nombre: 'Pizza Margarita', id: 'P002' },
  { nombre: 'Pizza Atún', id: 'P003' },
  { nombre: 'Pizza Mozzarella', id: 'P004' },
  { nombre: 'Pizza Hawaiana', id: 'P005' },
];

for (const pizza of pizzas) {
  // new Option(texto, valor, seleccionadaPorDefecto, seleccionada)
  lista.add(new Option(pizza.nombre, pizza.id));
}
</script>
</body>
</html>
