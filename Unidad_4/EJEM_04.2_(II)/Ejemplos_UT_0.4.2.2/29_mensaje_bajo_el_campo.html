<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mostrar el mensaje bajo el campo</title>
  <style>
body { font-family: Arial, sans-serif; margin: 24px; max-width: 520px; }
label { display: block; margin-top: 10px; }
input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], textarea, select { padding: 6px; width: 100%; box-sizing: border-box; }
button { margin-top: 12px; padding: 6px 14px; }
.nota { color: #666; font-size: 14px; }
.error { color: darkred; margin: 4px 0 12px; }
.error:empty { display: none; } /* sin mensaje, no ocupa espacio */
input { display: block; padding: 6px; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
<h2>Mostrar el mensaje bajo el campo</h2>
<label for="correo">Correo electrónico:</label>
<input type="email" id="correo" name="correo" required>
<p id="error-correo" class="error"></p>
<script type="module">
const campoCorreo = document.getElementById('correo');
const zonaError = document.getElementById('error-correo');

campoCorreo.addEventListener('change', () => {
  // validationMessage es '' cuando el campo es válido, así que no hace falta un if
  zonaError.textContent = campoCorreo.validationMessage;
});
</script>
</body>
</html>
