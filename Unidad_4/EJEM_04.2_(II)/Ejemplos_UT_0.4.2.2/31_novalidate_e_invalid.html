<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>noValidate, checkValidity e invalid</title>
  <style>
body { font-family: Arial, sans-serif; margin: 24px; max-width: 520px; }
label { display: block; margin-top: 10px; }
input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], textarea, select { padding: 6px; width: 100%; box-sizing: border-box; }
button { margin-top: 12px; padding: 6px 14px; }
.nota { color: #666; font-size: 14px; }
input { display: block; padding: 6px; width: 100%; box-sizing: border-box; }
.error { color: darkred; margin: 4px 0; }
.error:empty { display: none; }
  </style>
</head>
<body>
<h2>noValidate, checkValidity e invalid</h2>
<form id="registro" name="registro" method="post" action="#">
  <label for="usuario">Usuario:</label>
  <input type="text" id="usuario" name="usuario" required minlength="3">
  <p id="error-usuario" class="error"></p>

  <label for="correo">Correo electrónico:</label>
  <input type="email" id="correo" name="correo" required>
  <p id="error-correo" class="error"></p>

  <label for="edad">Edad:</label>
  <input type="number" id="edad" name="edad" min="18" max="99" value="18">
  <p id="error-edad" class="error"></p>

  <button type="submit">Registrarse</button>
</form>
<p id="resultado"></p>
<script type="module">

const formulario = document.getElementById('registro');
formulario.noValidate = true; // desactiva los avisos automáticos del navegador

function mostrarError(campo) {
  const zona = document.getElementById(`error-${campo.id}`);
  if (zona) zona.textContent = campo.validationMessage;
} 

formulario.addEventListener('submit', (evento) => {
  if (!formulario.checkValidity()) { // ¿son válidos TODOS los campos?
    evento.preventDefault();         // no se envía el formulario
  }
});

// El evento invalid no burbujea: se escucha en la fase de captura (true)
formulario.addEventListener('invalid', (evento) => {
  evento.preventDefault(); // evita la burbuja de aviso del navegador
  const campo = evento.target;
  mostrarError(campo);
}, true);
</script>
</body>
</html>
