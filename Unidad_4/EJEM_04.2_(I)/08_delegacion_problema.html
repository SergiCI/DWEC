<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sin delegación: las tareas nuevas no funcionan</title>
  <style>
body { font-family: Arial, sans-serif; margin: 24px; max-width: 520px; }
label { display: block; margin-top: 10px; }
input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], textarea, select { padding: 6px; width: 100%; box-sizing: border-box; }
button { margin-top: 12px; padding: 6px 14px; }
.nota { color: #666; font-size: 14px; }

  </style>
</head>
<body>
<h2>Sin delegación: las tareas nuevas no funcionan</h2>
<ul id="tareas">
  <li>Estudiar eventos <button class="borrar">Borrar</button></li>
  <li>Hacer el ejercicio <button class="borrar">Borrar</button></li>
</ul>
<button id="agregar">Añadir tarea</button>
<script type="module">
const lista = document.getElementById('tareas');

// Un escuchador por cada botón que existe AHORA
document.querySelectorAll('.borrar').forEach((boton) => {
  boton.addEventListener('click', () => {
    boton.closest('li').remove();
  });
});

document.getElementById('agregar').addEventListener('click', () => {
  const tarea = document.createElement('li');
  tarea.innerHTML = 'Nueva tarea <button class="borrar">Borrar</button>';
  lista.append(tarea); // ¡El botón de esta tarea NO tiene escuchador!
});
</script>
</body>
</html>
