<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>value es texto, valueAsNumber es número</title>
  <style>
body { font-family: Arial, sans-serif; margin: 24px; max-width: 520px; }
label { display: block; margin-top: 10px; }
input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], textarea, select { padding: 6px; width: 100%; box-sizing: border-box; }
button { margin-top: 12px; padding: 6px 14px; }
.nota { color: #666; font-size: 14px; }

  </style>
</head>
<body>
<h2>value es texto, valueAsNumber es número</h2>
<input type="number" id="edad" value="18">
<p class="nota">Abre la consola del navegador (F12) para ver los resultados.</p>
<script type="module">
const campoEdad = document.getElementById('edad'); // <input type="number"> con el valor 18

console.log(campoEdad.value + 1);         // «181»: value siempre es texto
console.log(campoEdad.valueAsNumber + 1); // 19: valueAsNumber ya es un número
</script>
</body>
</html>
