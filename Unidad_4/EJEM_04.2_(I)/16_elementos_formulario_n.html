<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Los controles del formulario</title>
  <style>
body { font-family: Arial, sans-serif; margin: 24px; max-width: 520px; }
label { display: block; margin-top: 10px; }
input[type=text], input[type=password], input[type=email], input[type=url], input[type=number], textarea, select { padding: 6px; width: 100%; box-sizing: border-box; }
button { margin-top: 12px; padding: 6px 14px; }
.nota { color: #666; font-size: 14px; }

  </style>
</head>
<body>
<h2>Los controles del formulario</h2>
<form id="acceso" name="acceso" method="post" action="acceso.html">
  <div>
    <label for="usuario">Usuario:</label>
    <input type="text" id="usuario" name="usuario" placeholder="Usuario">
  </div>
  <div>
    <label for="clave">Contraseña:</label>
    <input type="password" id="clave" name="clave" placeholder="Contraseña">
  </div>
  <div>
    <label>
      <input type="checkbox" id="recordar" name="recordar" value="on">
      Recordarme en este equipo
    </label>
  </div>
  <button type="submit" id="entrar">Entrar</button>
</form>
<p class="nota">Abre la consola del navegador (F12) para ver los resultados.</p>
<script type="module">
// 1) Métodos de selección del DOM
const campoUsuario = document.getElementById('usuario');
const campoClave = document.getElementById('clave');
const casillaRecordar = document.getElementById('recordar');
const botonEntrar = document.getElementById('entrar');

// 2) Propiedad elements, por posición...
const formulario = document.getElementById('acceso');
const controles = formulario.elements;
console.log(controles.length);   // 4
console.log(controles[0].id);    // «usuario»
console.log(controles[3].id);    // «entrar»

// 3) ...o por nombre (más legible y no depende del orden)
console.log(controles.usuario === campoUsuario); // true
console.log(controles.clave.id);                 // «clave»
</script>
</body>
</html>
