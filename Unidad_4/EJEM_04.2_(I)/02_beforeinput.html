<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>beforeinput: impedir cifras</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      max-width: 520px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input[type=text],
    input[type=password],
    input[type=email],
    input[type=url],
    input[type=number],
    textarea,
    select {
      padding: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      margin-top: 12px;
      padding: 6px 14px;
    }

    .nota {
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h2>beforeinput: impedir cifras</h2>
  <form id="contacto">
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre">
    <button type="submit">Enviar</button>
  </form>
  <script type="module">
    const campoNombre = document.getElementById('nombre');

    // Impide escribir cifras en el campo «nombre»
    campoNombre.addEventListener('beforeinput', (evento) => {
      if (evento.data && /\d/.test(evento.data)) {
        evento.preventDefault(); // cancela la modificación
      }
    });
  </script>
</body>

</html>
